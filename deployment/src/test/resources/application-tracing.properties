# Quarkus 4 defaults to parentbased_traceidratio with a 0.1 ratio, which drops most traces
quarkus.otel.traces.sampler=parentbased_always_on
# Quarkus 4 enables OTLP metrics and logs export by default; no collector is running in tests
quarkus.otel.metrics.enabled=false
quarkus.otel.logs.enabled=false

quarkus.messaging.nats.streams.test-tracing.name=test-tracing
quarkus.messaging.nats.streams.test-tracing.subjects=data-tracing,data-stream

quarkus.messaging.nats.consumers.data-consumer.stream=test-tracing
quarkus.messaging.nats.consumers.data-consumer.name=data-consumer
quarkus.messaging.nats.consumers.data-consumer.filter-subject=unstable-data
quarkus.messaging.nats.consumers.data-consumer.durable=true

quarkus.messaging.nats.consumers.data-collector.stream=test-tracing
quarkus.messaging.nats.consumers.data-collector.name=data-collector
quarkus.messaging.nats.consumers.data-collector.filter-subject=data-stream
quarkus.messaging.nats.consumers.data-collector.durable=true
quarkus.messaging.nats.consumers.data-collector.max-deliver=1

mp.messaging.outgoing.data.connector=quarkus-jetstream
mp.messaging.outgoing.data.stream=test-tracing
mp.messaging.outgoing.data.subject=data-tracing

mp.messaging.outgoing.data-emitter.connector=quarkus-jetstream
mp.messaging.outgoing.data-emitter.stream=test-tracing
mp.messaging.outgoing.data-emitter.subject=data-stream

mp.messaging.incoming.data-consumer.connector=quarkus-jetstream
mp.messaging.incoming.data-consumer.stream=test-tracing
mp.messaging.incoming.data-consumer.consumer=data-consumer

mp.messaging.incoming.data-collector.connector=quarkus-jetstream
mp.messaging.incoming.data-collector.stream=test-tracing
mp.messaging.incoming.data-collector.consumer=data-collector