quarkus.messaging.nats.streams.test.name=test
quarkus.messaging.nats.streams.test.subjects=data,data-stream

quarkus.messaging.nats.consumers.data-consumer.stream=test
quarkus.messaging.nats.consumers.data-consumer.name=data-consumer
quarkus.messaging.nats.consumers.data-consumer.filter-subject=data
quarkus.messaging.nats.consumers.data-consumer.durable=true

quarkus.messaging.nats.consumers.data-collector.stream=test
quarkus.messaging.nats.consumers.data-collector.name=data-collector
quarkus.messaging.nats.consumers.data-collector.filter-subject=data-stream
quarkus.messaging.nats.consumers.data-collector.durable=true
quarkus.messaging.nats.consumers.data-collector.max-deliver=1

mp.messaging.outgoing.data.connector=quarkus-jetstream
mp.messaging.outgoing.data.stream=test
mp.messaging.outgoing.data.subject=data

mp.messaging.incoming.data-consumer.connector=quarkus-jetstream
mp.messaging.incoming.data-consumer.stream=test
mp.messaging.incoming.data-consumer.consumer=data-consumer

mp.messaging.outgoing.data-emitter.connector=quarkus-jetstream
mp.messaging.outgoing.data-emitter.stream=test
mp.messaging.outgoing.data-emitter.subject=data-stream

mp.messaging.incoming.data-collector.connector=quarkus-jetstream
mp.messaging.incoming.data-collector.stream=test
mp.messaging.incoming.data-collector.consumer=data-collector