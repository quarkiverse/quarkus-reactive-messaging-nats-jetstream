quarkus.messaging.nats.streams.continuous.name=continuous
quarkus.messaging.nats.streams.continuous.subjects=values,typed-values

quarkus.messaging.nats.consumers.continuous-consumer.stream=continuous
quarkus.messaging.nats.consumers.continuous-consumer.name=continuous-consumer
quarkus.messaging.nats.consumers.continuous-consumer.filter-subject=values
quarkus.messaging.nats.consumers.continuous-consumer.durable=true

quarkus.messaging.nats.consumers.continuous-typed-consumer.stream=continuous
quarkus.messaging.nats.consumers.continuous-typed-consumer.name=continuous-typed-consumer
quarkus.messaging.nats.consumers.continuous-typed-consumer.filter-subject=typed-values
quarkus.messaging.nats.consumers.continuous-typed-consumer.durable=true

mp.messaging.outgoing.continuous-producer.connector=quarkus-jetstream
mp.messaging.outgoing.continuous-producer.stream=continuous
mp.messaging.outgoing.continuous-producer.subject=values

mp.messaging.outgoing.continuous-typed-producer.connector=quarkus-jetstream
mp.messaging.outgoing.continuous-typed-producer.stream=continuous
mp.messaging.outgoing.continuous-typed-producer.subject=typed-values

# The pull window (batch-size and timeout) is much wider than the number of published messages, so a partial batch
# is only delivered when the messages arrive, not when the pull window ends.
mp.messaging.incoming.continuous-in.connector=quarkus-jetstream
mp.messaging.incoming.continuous-in.stream=continuous
mp.messaging.incoming.continuous-in.consumer=continuous-consumer
mp.messaging.incoming.continuous-in.batch-size=100
mp.messaging.incoming.continuous-in.timeout=15000

mp.messaging.incoming.continuous-typed-in.connector=quarkus-jetstream
mp.messaging.incoming.continuous-typed-in.stream=continuous
mp.messaging.incoming.continuous-typed-in.consumer=continuous-typed-consumer
mp.messaging.incoming.continuous-typed-in.batch-size=100
mp.messaging.incoming.continuous-typed-in.timeout=15000
mp.messaging.incoming.continuous-typed-in.payload-type=java.lang.Integer
